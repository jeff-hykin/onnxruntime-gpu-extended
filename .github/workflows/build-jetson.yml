name: build-jetson-wheel

# Build onnxruntime CUDA wheels for NVIDIA Jetson on a NATIVE aarch64 runner
# (ubuntu-24.04-arm) — no qemu, so it's far faster than emulating on x86_64.
# Uses the same docker/Dockerfile.jetson recipe as the local build.

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version (e.g. 3.12)"
        default: "3.12"
      l4t_tag:
        description: "L4T base tag. r36.4.0 = JetPack 6.1/6.2 (CUDA 12.6, cuDNN 9); r36.3.0 = JetPack 6.0 (CUDA 12.2, cuDNN 8)"
        default: "r36.4.0"
      build_jobs:
        description: "Compile parallelism"
        default: "1"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          # L4T r36.x (JetPack 6) on Orin sm_87, onnxruntime 1.22.2
          # (abseil 20240722.0 + cutlass v3.5.1 — the nvcc-safe combo).
          # A wheel links whatever cuDNN major its base image ships, so it only
          # runs on that JetPack: r36.4.0 -> libcudnn.so.9 (JP6.1/6.2),
          # r36.3.0 -> libcudnn.so.8 (JP6.0). ORT 1.22.2 builds against either;
          # on cuDNN 8 it just compiles without the NHWC ops.
          - l4t_tag: ${{ github.event.inputs.l4t_tag || 'r36.4.0' }}
            ort_version: v1.22.2
            cutlass_tag: v3.5.1
            cuda_arch: "87"
            python_version: ${{ github.event.inputs.python_version || '3.12' }}
    steps:
      - uses: actions/checkout@v4

      # onnxruntime + CUDA build tree is large; reclaim space on the runner.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      # GH arm runners are 4-core/16GB. The onnxruntime CUDA build (esp. the
      # providers_cuda link) spikes past 16GB and OOM-kills the build. Add swap
      # to survive the spikes. Swap alone isn't enough at -j4: the thrash during
      # the nvcc-heavy phase (~90-95%) starves the runner agent and GitHub kills
      # the job with a bare "The operation was canceled" — hence serial compile.
      - name: Add swap
        run: |
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          echo "=== mem ==="; free -h

      - name: Build wheel (native aarch64, no emulation)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f docker/Dockerfile.jetson \
            --build-arg L4T_TAG=${{ matrix.l4t_tag }} \
            --build-arg ORT_VERSION=${{ matrix.ort_version }} \
            --build-arg CUTLASS_TAG=${{ matrix.cutlass_tag }} \
            --build-arg PYTHON_VERSION=${{ matrix.python_version }} \
            --build-arg CUDA_ARCH=${{ matrix.cuda_arch }} \
            --build-arg BUILD_JOBS=${{ github.event.inputs.build_jobs || '1' }} \
            --target wheel \
            --output type=local,dest=./wheels \
            .
          ls -lh ./wheels

      # Upload before smoke-testing: the compile takes ~4h, so a wheel that builds
      # but fails its test must still be recoverable from the artifact.
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-${{ matrix.l4t_tag }}-cp${{ matrix.python_version }}
          path: ./wheels/*.whl
          if-no-files-found: error

      # Reuses the cached build stage from the step above, so this is quick.
      - name: Smoke-test the wheel
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f docker/Dockerfile.jetson \
            --build-arg L4T_TAG=${{ matrix.l4t_tag }} \
            --build-arg ORT_VERSION=${{ matrix.ort_version }} \
            --build-arg CUTLASS_TAG=${{ matrix.cutlass_tag }} \
            --build-arg PYTHON_VERSION=${{ matrix.python_version }} \
            --build-arg CUDA_ARCH=${{ matrix.cuda_arch }} \
            --build-arg BUILD_JOBS=${{ github.event.inputs.build_jobs || '1' }} \
            --target smoketest \
            --output type=cacheonly \
            --progress plain \
            .
